<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Calorie Tracker with Indonesian Food Database</h1>
    </header>
    <main>
        <section id="tracker">
            <h2>Daily Tracking</h2>
            <input type="text" id="food-input" placeholder="Enter food name..." autocomplete="off" />
            <button id="add-button">Add</button>
            <progress id="progress-bar" value="0" max="100"></progress>
            <div id="daily-log"></div>
        </section>
        <section id="weekly-chart">
            <h2>Weekly Chart</h2>
            <canvas id="chart"></canvas>
        </section>
        <section id="data-export">
            <button id="export-button">Export Data</button>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Calorie Tracker App</p>
    </footer>
</body>
</html>
